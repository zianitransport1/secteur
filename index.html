<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma tournée">
<title>Ma tournée</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--bg:#0f172a;--card:#ffffff;--ink:#0f172a;--mut:#64748b;--pink:#ff2ec4;--green:#16a34a;--sector:#00c800;--blue:#2563eb;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  #map{position:fixed;inset:0}
  .top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:500;background:var(--card);border-radius:16px;
       box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px 14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .who{font-weight:800;font-size:19px}
  .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .pct{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--green);font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:99px;background:#fde7f7;margin-top:10px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:99px;transition:width .6s}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:6px;vertical-align:middle}
  .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
  .legend b{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
         padding:8px 14px calc(12px + env(safe-area-inset-bottom));max-height:45vh;display:flex;flex-direction:column;transition:max-height .3s}
  .sheet.closed{max-height:calc(58px + env(safe-area-inset-bottom))}
  .sheet.closed ul{display:none}
  .handle{width:40px;height:5px;border-radius:9px;background:#cbd5e1;margin:2px auto 8px}
  .grab{padding:4px 0 6px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
  .sheet h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
  .sheet h3 em{font-style:normal;margin-left:auto;color:var(--mut);font-size:12px}
  .sheet h3 span{color:var(--mut);font-weight:500;font-size:13px}
  ul{list-style:none;margin:0;padding:0;overflow:auto}
  li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid #f1f5f9;font-size:14px}
  li .n{display:flex;align-items:center;gap:8px}
  li .t{width:10px;height:10px;border-radius:3px;background:var(--pink);flex:none}
  li.done{color:var(--mut)} li.done .t{background:var(--green)} li.part .t{background:linear-gradient(90deg,var(--green) 50%,var(--pink) 50%)}
  li .a{font-size:12px;color:var(--mut)}
  .btn{position:fixed;right:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:20px}
  #me{bottom:calc(45vh + 12px)} .sheet.closed ~ #me{bottom:calc(72px + env(safe-area-inset-bottom))}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:900;background:var(--bg);color:#fff;text-align:center;padding:30px;font-size:16px}
  .leaflet-control-attribution{font-size:9px}
  .go{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:600;border:0;border-radius:99px;
      padding:15px 26px;font-size:17px;font-weight:800;color:#fff;background:#16a34a;box-shadow:0 8px 24px rgba(22,163,74,.45);white-space:nowrap}
  .go.stop{background:#0f172a;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:11px 20px;font-size:15px}
  .sheet:not(.closed) ~ .go{display:none}
  .live{display:none;margin-top:6px;font-size:12px;font-weight:600;color:#16a34a}
  .live.on{display:block}
  .live.warn{color:#d97706}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="row">
    <div>
      <div class="who" id="who">Ma tournée</div>
      <div class="sub"><span class="dot" id="dot"></span><span id="status">Chargement…</span></div>
    </div>
    <div style="text-align:right">
      <div class="pct" id="pct">–</div>
      <div class="sub" id="cnt"></div>
    </div>
  </div>
  <div class="live" id="live"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="legend"><span><b style="background:var(--pink)"></b>À faire</span><span><b style="background:var(--green)"></b>Fait</span><span><b style="background:var(--blue)"></b>Mon trajet</span><span><b style="background:var(--sector)"></b>Secteur</span></div>
</div>
<div class="sheet closed" id="sheet">
  <div class="grab" id="grab"><div class="handle"></div>
  <h3>Rues <span id="rest"></span><em id="arrow">▲</em></h3></div>
  <ul id="list"></ul>
</div>
<button class="btn" id="me" title="Me centrer">◎</button>
<button class="go" id="go">▶ Démarrer ma tournée</button>
<div class="msg" id="msg" style="display:none"></div>
<script>
(function(){
  var key = new URLSearchParams(location.search).get('k') || '';
  var BASE = 'https://ziani1.app.n8n.cloud/webhook/tournee';
  var api = BASE + '-data?k=' + encodeURIComponent(key);
  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([50.853, 4.281], 15);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' }).addTo(map);
  var gSector = L.layerGroup().addTo(map), gStreets = L.layerGroup().addTo(map), gTrace = L.layerGroup().addTo(map), gMe = L.layerGroup().addTo(map);
  var gLive = L.layerGroup().addTo(map);
  var first = true, lastPos = null;
  var posUrl = BASE + '-pos';
  var sheet = document.getElementById('sheet');
  var grab = document.getElementById('grab'), y0 = null, moved = false;
  function setOpen(o){ sheet.classList.toggle('closed', !o); document.getElementById('arrow').textContent = o ? '▼' : '▲'; }
  grab.addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; moved = false; }, { passive:true });
  grab.addEventListener('touchmove', function(e){ if (y0 !== null && Math.abs(e.touches[0].clientY - y0) > 15) moved = true; }, { passive:true });
  grab.addEventListener('touchend', function(e){ if (y0 === null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (moved) setOpen(dy < 0); else setOpen(sheet.classList.contains('closed')); e.preventDefault(); });
  grab.addEventListener('click', function(){ setOpen(sheet.classList.contains('closed')); });

  // ===== Suivi GPS intégré (remplace Traccar Client) =====
  var NL = String.fromCharCode(10), follow = true, gotFix = false;
  map.on('dragstart', function(){ follow = false; });
  var LS = 'tournee_' + key, watchId = null, wakeLock = null, queue = [], live = [], lastSent = null, sending = false;
  try { queue = JSON.parse(localStorage.getItem(LS + '_q') || '[]'); } catch (e) { queue = []; }
  function saveQ(){ try { localStorage.setItem(LS + '_q', JSON.stringify(queue.slice(-500))); } catch (e) {} }
  function setLive(txt, warn){ var el = document.getElementById('live'); el.textContent = txt || ''; el.className = 'live' + (txt ? ' on' : '') + (warn ? ' warn' : ''); }
  function dist(a, b){ var kx = 111320 * Math.cos(a[0] * Math.PI / 180); return Math.hypot((a[1]-b[1]) * kx, (a[0]-b[0]) * 110574); }
  function keepAwake(){
    if (!('wakeLock' in navigator)) { setLive('En tournée · pense à garder l’écran allumé', true); return; }
    navigator.wakeLock.request('screen').then(function(w){ if (watchId === null) { w.release(); return; } wakeLock = w; if (gotFix) setLive('● En tournée · écran maintenu allumé'); })
      .catch(function(){ if (watchId !== null) setLive('En tournée · pense à garder l’écran allumé', true); });
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && watchId !== null) { keepAwake(); flush(); }
  });
  function flush(){
    if (sending || !queue.length) return;
    sending = true; var batch = queue.slice(0, 50);
    fetch(posUrl, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ k: key, positions: batch }) })
      .then(function(r){ if (!r.ok) throw 0; queue = queue.slice(batch.length); saveQ(); })
      .catch(function(){ setLive('Pas de réseau · positions gardées, envoi dès que possible', true); })
      .then(function(){ sending = false; });
  }
  function onPos(pos){
    var c = pos.coords; if (c.accuracy > 60) return;
    var pt = [c.latitude, c.longitude];
    lastPos = pt;
    if (!gotFix) { gotFix = true; map.setView(pt, 17); } else if (follow) map.panTo(pt);
    gMe.clearLayers(); L.circleMarker(pt, { radius:9, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1 }).addTo(gMe);
    if (lastSent && dist(lastSent, pt) < 12 && pos.timestamp - lastSent.t < 60000) return;
    lastSent = pt; lastSent.t = pos.timestamp;
    queue.push({ lat: +pt[0].toFixed(6), lon: +pt[1].toFixed(6), acc: Math.round(c.accuracy), speed: c.speed || 0, t: pos.timestamp }); saveQ();
    live.push(pt); gLive.clearLayers(); if (live.length > 1) L.polyline(live, { color:'#2563eb', weight:3, opacity:0.85 }).addTo(gLive);
    if (wakeLock || !('wakeLock' in navigator)) setLive(wakeLock ? '● En tournée · écran maintenu allumé' : 'En tournée · pense à garder l’écran allumé', !wakeLock);
  }
  function start(){
    if (!navigator.geolocation) { alert('La localisation n’est pas disponible sur ce téléphone.'); return; }
    setLive('Recherche du GPS…'); gotFix = false; follow = true;
    watchId = navigator.geolocation.watchPosition(onPos, function(err){
      if (err.code === 1) { stop(true); setLive('Localisation refusée · voir réglages du téléphone', true);
        alert('La localisation est bloquée pour cette page.' + NL + NL + 'iPhone : Réglages > Confidentialité et sécurité > Service de localisation > Sites Safari (ou Safari) > « Lorsque l’app est active », puis recharge la page.' + NL + NL + 'Android : touche le cadenas à côté de l’adresse > Autorisations > Position > Autoriser.'); }
      else setLive('Signal GPS faible…', true);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    keepAwake();
    try { localStorage.setItem(LS + '_on', '1'); } catch (e) {}
    var b = document.getElementById('go'); b.textContent = '■ Terminer'; b.className = 'go stop';
  }
  function stop(silent){
    if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null;
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
    try { localStorage.removeItem(LS + '_on'); } catch (e) {}
    flush();
    var b = document.getElementById('go'); b.textContent = '▶ Démarrer ma tournée'; b.className = 'go';
    if (!silent) setLive('Tournée en pause');
  }
  document.getElementById('go').onclick = function(){ if (watchId === null) start(); else if (confirm('Terminer la tournée ?')) stop(); };
  setInterval(flush, 10000);
  window.addEventListener('online', flush);
  var wasOn = false; try { wasOn = localStorage.getItem(LS + '_on') === '1'; } catch (e) {}
  if (wasOn) { document.getElementById('go').textContent = '▶ Reprendre ma tournée'; }
  document.getElementById('me').onclick = function(){ follow = true; if (lastPos) map.setView(lastPos, 17); };

  function ago(iso){ if(!iso) return ''; var s=(Date.now()-new Date(iso))/1000; if(s<90) return "à l’instant"; if(s<3600) return 'il y a '+Math.round(s/60)+' min'; if(s<86400) return 'il y a '+Math.round(s/3600)+' h'; return 'il y a '+Math.round(s/86400)+' j'; }

  function draw(d){
    var tn = d.secteur && d.secteur.name ? d.secteur.name.split(' – ')[0].trim() : '';
    if (tn) tn = tn.charAt(0) + tn.slice(1).toLowerCase();
    document.getElementById('who').textContent = tn || d.chauffeur;
    if (tn) document.title = tn;
    document.getElementById('dot').className = 'dot' + (d.enLigne ? ' on' : '');
    document.getElementById('status').textContent = d.chauffeur + ' · ' + d.semaine + ' · ' + (d.enLigne ? 'suivi actif' : 'suivi coupé') + (d.derniereMaj ? ' ' + ago(d.derniereMaj) : '');
    document.getElementById('pct').textContent = d.pourcentage + ' %';
    document.getElementById('bar').style.width = d.pourcentage + '%';
    document.getElementById('cnt').textContent = d.ruesFaites + ' / ' + d.ruesTotal + ' rues';
    var rest = d.ruesTotal - d.ruesFaites;
    document.getElementById('rest').textContent = rest ? rest + ' à faire' : 'tout est fait 🎉';

    gSector.clearLayers(); gStreets.clearLayers(); gTrace.clearLayers(); if (watchId === null) gMe.clearLayers();
    if (d.secteur) L.polygon(d.secteur.coords, { color:'#00c800', weight:4, fillColor:'#00c800', fillOpacity:0.06 }).addTo(gSector);
    d.rues.forEach(function(r){ r.runs.forEach(function(run){
      if (run.c.length < 2) return;
      L.polyline(run.c, { color: run.ok ? '#16a34a' : '#ff2ec4', weight: 8, opacity: 0.95, lineCap:'round' }).bindTooltip(r.name).addTo(gStreets);
    }); });
    if (d.trace.length > 1) L.polyline(d.trace, { color:'#2563eb', weight:3, opacity:0.85 }).addTo(gTrace);
    if (d.position && watchId === null) {
      lastPos = d.position;
      L.circleMarker(d.position, { radius:9, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1 }).addTo(gMe);
    }
    var ul = document.getElementById('list'); ul.innerHTML = '';
    d.liste.forEach(function(s){
      var li = document.createElement('li'); li.className = s.done ? 'done' : (s.part ? 'part' : '');
      li.innerHTML = '<span class="n"><span class="t"></span><span></span></span><span class="a"></span>';
      li.querySelector('.n span:last-child').textContent = s.name;
      li.querySelector('.a').textContent = s.done ? 'fait' : (s.part ? 'en partie' : s.addr + ' adr.');
      li.onclick = function(){ var b=null; d.rues.forEach(function(r){ if(r.name===s.name) r.runs.forEach(function(run){ run.c.forEach(function(p){ b = b ? b.extend(p) : L.latLngBounds(p,p); }); }); }); if(b){ setOpen(false); map.fitBounds(b.pad(0.4)); } };
      ul.appendChild(li);
    });
    if (first && d.secteur) { map.fitBounds(L.polygon(d.secteur.coords).getBounds(), { padding:[20,20] }); first = false; }
  }

  function load(){
    fetch(api, { cache:'no-store' }).then(function(r){
      if (r.status === 404) throw new Error('lien');
      if (!r.ok) throw new Error('serveur');
      return r.json();
    }).then(function(d){ document.getElementById('msg').style.display='none'; draw(d); })
    .catch(function(e){
      if (e.message === 'lien') { var m=document.getElementById('msg'); m.textContent="Ce lien n’est pas valide. Demande ton lien à ton responsable."; m.style.display='flex'; }
      else document.getElementById('status').textContent = 'Connexion impossible, nouvel essai…';
    });
  }
  flush();
  if (!key) { var m=document.getElementById('msg'); m.textContent='Lien incomplet. Demande ton lien à ton responsable.'; m.style.display='flex'; }
  else { load(); setInterval(load, 30000); }
})();
</script>
</body>
</html>
