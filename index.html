<script>
// Diagnostic : au lieu d'un écran vide, affiche l'erreur et l'envoie au serveur (visible dans n8n)
(function(){
  var sent = 0;
  function show(m){
    try {
      var d = document.getElementById('zt-err') || document.createElement('div');
      d.id = 'zt-err';
      d.style.cssText = 'position:fixed;left:12px;right:12px;top:60px;z-index:99999;background:#fff;color:#b91c1c;font:13px/1.4 -apple-system,sans-serif;padding:14px;border-radius:12px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 20px rgba(0,0,0,.3)';
      d.textContent = (d.textContent || 'Problème dans l’appli — fais une capture d’écran et envoie-la à ton responsable :') + '\n\n' + m;
      (document.body || document.documentElement).appendChild(d);
    } catch (e) {}
  }
  function send(m){
    if (sent++ >= 5) return;
    try { fetch('https://ziani1.app.n8n.cloud/webhook/tournee-api', { method:'POST', headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ a:'diag', k: (localStorage.getItem('mt_key') || ''), url: location.href, ua: navigator.userAgent, m: String(m).slice(0, 3000) }) }).catch(function(){}); } catch (e) {}
  }
  window.addEventListener('error', function(e){
    if (!(e instanceof ErrorEvent)) return;   // images, tuiles de carte… ignorées
    var m = (e.message || 'erreur') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : '');
    show(m); send(m);
  });
  window.addEventListener('unhandledrejection', function(e){ var r = e.reason; send('Promesse rejetée : ' + ((r && (r.stack || r.message)) || r)); });
  setTimeout(function(){
    if (document.querySelector('#msg.on,#home.on,#qr.on,#mapScreen.on,#cloture.on')) return;
    var C = window.Capacitor, m = 'Écran vide après 10 s · Capacitor : ' + !!C + ' · plateforme : ' + (C && C.getPlatform ? C.getPlatform() : '-') +
      ' · Leaflet : ' + (typeof L) + ' · QR : ' + (typeof qrcode) + ' · lien : ' + ((function(){ try { return localStorage.getItem('mt_key') ? 'oui' : 'non'; } catch (e) { return 'erreur stockage'; } })());
    show(m); send(m);
  }, 10000);
})();

<style>

  #near{position:fixed;left:10px;right:10px;top:calc(150px + env(safe-area-inset-top));z-index:700;background:#fbbf24;color:#0f172a;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
  #near.on{display:block}

</style>

<script>
(function(){
  'use strict';
  var API = 'https://ziani1.app.n8n.cloud/webhook/tournee-api';
  var SEND_EVERY = 5 * 60 * 1000;   // envoi des positions au serveur toutes les 5 min (économise les exécutions n8n)
  var R = 25, STEP = 8, DONE = 0.8; // rue faite si le chauffeur est passé à moins de 25 m sur 80 % de sa longueur
  // Dans l'app iPhone (Capacitor), le lien personnel est saisi une fois puis mémorisé sur le téléphone
  var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  function savedKey(){ try { return localStorage.getItem('mt_key') || ''; } catch (e) { return ''; } }
  var key = new URLSearchParams(location.search).get('k') || (NATIVE ? savedKey() : '');
  var NL = String.fromCharCode(10);
  var $ = function(id){ return document.getElementById(id); };
  function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('mt_' + key + '_' + k) || 'null'); localStorage.setItem('mt_' + key + '_' + k, JSON.stringify(v)); } catch (e) { return null; } }
  function lsDel(k){ try { localStorage.removeItem('mt_' + key + '_' + k); } catch (e) {} }

  function show(id){ ['home','qr','mapScreen'].forEach(function(s){ $(s).classList.toggle('on', s === id); }); if (id === 'mapScreen' && map) setTimeout(function(){ map.invalidateSize(); }, 50); }
  function msg(html, btn, fn){ var m = $('msg'); m.innerHTML = '<img class="mlogo" src="logo-blanc.png" alt="Ziani Transport">' + html; if (btn) { var b = document.createElement('button'); b.textContent = btn; b.onclick = fn; m.appendChild(b); } m.classList.add('on'); }
  function hideMsg(){ $('msg').classList.remove('on'); }
  // Suivi en direct (avancement, pause, clôture) : serveur séparé, géré par l'admin
  var SUIVI = 'https://ziani1.app.n8n.cloud/webhook/tournee-suivi';
  function suivi(body){
    body.k = key;
    return fetch(SUIVI, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(body), cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('serveur'); return r.json(); });
  }
  var etatsSrv = ls('etats') || {};   // { idSecteur: { etat: 'clos' | 'rouvert' | 'en cours' | 'pause', pct } }
  function setEtats(d){ var m = {}; ((d && d.etats) || []).forEach(function(e){ m[e.s] = e; }); etatsSrv = m; ls('etats', m); }
  function clos(id){
    var e = etatsSrv[id];
    if (e && e.etat === 'rouvert') { lsDel('clos_' + wk() + '_' + id); return null; }
    if (e && e.etat === 'clos') return e.pct;
    var l = ls('clos_' + wk() + '_' + id); return l == null ? null : l;
  }
  // envois en attente (clôture faite sans réseau) : renvoyés dès que possible

        if (err) {
          if (err.code === 'NOT_AUTHORIZED') {
            stop(true); setLive('Localisation refusée · voir réglages du téléphone', true);
            if (confirm('La localisation est bloquée pour Ma tournée.' + NL + NL + 'Ouvrir les réglages pour choisir « Lorsque l’app est active » ou « Toujours » ?')) BG.openSettings();
          } else setLive('Signal GPS faible…', true);
          return;
        }
        if (!loc || watchId === null) return;
        onPos({ coords: { latitude: loc.latitude, longitude: loc.longitude, accuracy: loc.accuracy, speed: loc.speed, heading: loc.bearing }, timestamp: loc.time || Date.now() });
      }).then(function(id){ if (watchId === null) BG.removeWatcher({ id: id }); else bgId = id; });
  }
  function keepAwake(){
    if (NATIVE) return;
    if (!('wakeLock' in navigator)) { setLive('En tournée · garde l’écran allumé', true); return; }
    navigator.wakeLock.request('screen').then(function(w){ if (watchId === null) { w.release(); return; } wakeLock = w; if (gotFix) setLive('● En tournée · écran maintenu allumé'); })
      .catch(function(){ if (watchId !== null) setLive('En tournée · garde l’écran allumé', true); });
  }
  function onResume(){
    if (watchId === null || !map) return;
    if (ZT) { ztCatchUp().then(function(){ if (watchId !== null) redrawNow(); }); return; }
    redrawNow();
  }
  function redrawNow(){
    map.invalidateSize({ pan: false });
    if (lastPos && follow) map.setView(lastPos, map.getZoom(), { animate: false });
    if (streets.length) { lastDraw = Date.now(); drawAll(); } applyRot();
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && watchId === null && data) autoResume();
    if (document.visibilityState === 'visible' && watchId !== null) { keepAwake(); onResume(); watchdog(); }
    if (document.visibilityState === 'hidden') { trDirty = true; saveLocal(); flush(true); }
  });
  addEventListener('pagehide', function(){ trDirty = true; saveLocal(); });
  // Android : si le GPS natif ne renvoie plus rien depuis 3 min alors que la tournée tourne, on relance le suivi
  function watchdog(){
    if (!BG || ZT || watchId === null || !lastFix || Date.now() - lastFix < 180000) return;
    if (bgId !== null) BG.removeWatcher({ id: bgId }); bgId = null; lastFix = Date.now();
    startNative();
  }
  setInterval(watchdog, 60000);
  // flèche grise si plus de position depuis 20 s (au lieu de disparaître)
  var lastFix = 0;
  setInterval(function(){
    var old = watchId !== null && lastFix && Date.now() - lastFix > 20000;
    var pane = map && map.getPane('pMe'); if (pane) pane.style.filter = old ? 'grayscale(1) opacity(.6)' : '';
    if (old && !document.hidden) setLive('Signal GPS perdu… dernière position affichée', true);
    else if (!old && watchId !== null && NATIVE && gotFix && /Signal GPS perdu/.test($('live').textContent)) setLive(LIVE_NATIVE);
  }, 5000);
  function flush(force){
    if (sending || !queue.length) return;
    if (!force && Date.now() - lastFlush < SEND_EVERY && queue.length < 60) return;
    sending = true; var batch = queue.slice(0, 200);
    api({ a:'pos', positions: batch })
      .then(function(){ queue = queue.slice(batch.length); trDirty = true; lastFlush = Date.now(); })
      .catch(function(){ if (watchId !== null) setLive('Pas de réseau · positions gardées, envoi dès que possible', true); })
      .then(function(){ sending = false; });
  }
  function onPos(pos){
    var c = pos.coords, pt = [c.latitude, c.longitude];
    if (c.accuracy > 150) return;                      // position inutilisable
    lastPos = pt; lastFix = Date.now();
    if (c.heading != null && c.heading >= 0 && (c.speed || 0) > 0.8) { heading = c.heading; lastCourse = Date.now(); }
    if (!gotFix) { gotFix = true; follow = true; map.setView(pt, navOn ? 18 : 17); }
    else if (follow) map.panTo(pt, { animate: !document.hidden && (c.speed || 0) < 12, duration: 0.5 });
    applyRot();
    if (c.accuracy > 60) return;                       // signal moyen : la flèche bouge, mais on ne valide pas de rue
    tPoint(pt, pos.timestamp || Date.now()); verifierProche(pt);
    if (pos.zt) {                                      // iPhone : l'app a déjà filtré et envoyé le point
      if (!pos.keep) return;
      liveTrace().push([+pt[0].toFixed(6), +pt[1].toFixed(6)]); trDirty = true;
      if (Date.now() - lastDraw > 8000 && streets.length) { lastDraw = Date.now(); drawAll(); }
      setLive(LIVE_NATIVE); return;
    }
    if (lastSent && dist(lastSent, pt) < 10 && pos.timestamp - lastSent.t < 60000) return;
    lastSent = pt; lastSent.t = pos.timestamp;
    queue.push({ lat: +pt[0].toFixed(6), lon: +pt[1].toFixed(6), acc: Math.round(c.accuracy), speed: c.speed || 0, t: pos.timestamp });
    liveTrace().push([+pt[0].toFixed(6), +pt[1].toFixed(6)]); trDirty = true;
    if (Date.now() - lastDraw > 8000 && streets.length) { lastDraw = Date.now(); drawAll(); }
    else if (!streets.length) drawTrace();
    if (NATIVE) setLive(LIVE_NATIVE);
    else if (wakeLock || !('wakeLock' in navigator)) setLive(wakeLock ? '● En tournée · écran maintenu allumé' : 'En tournée · garde l’écran allumé', !wakeLock);
    flush(false);
  }
  var lastProg = 0, lastProgPct = -1;
  function sendProg(etat, sur){
    if (!cur) return Promise.resolve();
    var pct = streets.length ? compute() : 0; lastProg = Date.now(); lastProgPct = pct;
    sendTemps(etat !== 'en cours');
    return sendSuivi({ a:'prog', s: cur.id, nom: cur.nom, pct: pct, etat: etat }, sur);
  }
  function start(){
    tStart();
    sendProg('en cours');
    if (BG) {
      var ANDROID = window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android';
      if (ANDROID && !localStorage.getItem('mt_batt')) {
        try { localStorage.setItem('mt_batt', '1'); } catch (e) {}
        if (confirm('Pour que le suivi marche écran verrouillé :' + NL + NL + 'Dans les réglages qui vont s’ouvrir, touche « Batterie » puis choisis « Sans restriction » (ou « Non optimisée »).' + NL + NL + 'Ouvrir les réglages maintenant ?')) BG.openSettings();
      }
      setLive('Recherche du GPS…'); gotFix = false; follow = true;
      startNative(); ls('on', wk()); paused = false; lsDel('pause'); setCtrl('run');
      return;
    }
    if (!navigator.geolocation) { alert('La localisation n’est pas disponible sur ce téléphone.'); return; }
    setLive('Recherche du GPS…'); gotFix = false; follow = true;
    watchId = navigator.geolocation.watchPosition(onPos, function(err){
      if (err.code === 1) { stop(true); setLive('Localisation refusée · voir réglages du téléphone', true);
        alert('La localisation est bloquée pour cette page.' + NL + NL + 'iPhone : Réglages > Confidentialité et sécurité > Service de localisation > Sites Safari (ou Safari) > « Lorsque l’app est active », puis recharge la page.' + NL + NL + 'Android : touche le cadenas à côté de l’adresse > Autorisations > Position > Autoriser.'); }
      else setLive('Signal GPS faible…', true);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    keepAwake(); ls('on', wk()); paused = false; lsDel('pause'); setCtrl('run');
  }
  function stop(silent){
    if (ZT) { if (watchId !== null) { ZT.stop().catch(function(){}); } ztSubs.forEach(function(h){ h.remove(); }); ztSubs = []; }
    else if (BG) { if (bgId !== null) BG.removeWatcher({ id: bgId }); bgId = null; }
    else if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
    lsDel('on'); flush(true);
    setCtrl('idle');
    if (!silent) { setLive('Tournée en pause · positions envoyées'); if (streets.length) drawAll(); }
  }

  // ---- Boutons Pause / Reprendre / Terminer ----
  var paused = false;
  function setCtrl(st){
    var go = $('go'), pz = $('pause');
    if (st === 'run') { pz.hidden = false; pz.textContent = '⏸ Pause'; pz.className = 'go pause'; go.textContent = '■ Terminer'; go.className = 'go stop'; }
    else if (st === 'paused') { pz.hidden = false; pz.textContent = '▶ Reprendre'; pz.className = 'go'; go.textContent = '■ Terminer'; go.className = 'go stop'; }
    else { pz.hidden = true; go.textContent = ls('on') || ls('pause') ? '▶ Reprendre ma tournée' : '▶ Démarrer ma tournée'; go.className = 'go'; }
  }
  $('pause').onclick = function(){
    if (paused) { start(); return; }
    stop(true); paused = true; ls('pause', 1); setCtrl('paused'); sendProg('pause');
    setLive('⏸ Secteur en pause · appuie sur Reprendre pour continuer', true);
    if (streets.length) drawAll();
  };
  $('go').onclick = function(){ if (watchId === null && !paused) start(); else openCloture(); };

  // ---- Clôture : paiement à partir de 98 % ; bonus 15 % à 98 % seulement pour les chauffeurs dont le bonus est activé ----
  var PAYE = 98, BONUS15 = 98;
  function openCloture(){
    var pct = streets.length ? compute() : null, bonus = !!(data && data.bonus), al = [];
    $('cSect').textContent = cur ? cur.nom : '';
    $('cPct').textContent = pct == null ? '' : pct + ' %';
    $('cPct').style.color = pct == null ? '' : (pct < PAYE ? '#dc2626' : '#16a34a');
    function a(cls, t){ al.push('<div class="al ' + cls + '">' + t + '</div>'); }
    if (pct == null) a('amb', 'La carte de ce secteur n’est pas disponible : l’avancement ne peut pas être calculé.');
    else if (pct < PAYE) a('red', '⛔ <b>Ce secteur ne sera pas payé</b> si tu clôtures maintenant : il faut au moins ' + PAYE + ' % des rues faites.');
    else {
      a('ok', '✅ ' + PAYE + ' % atteint : le secteur sera payé.');
      if (bonus && pct >= BONUS15) a('ok', '🏆 Bonus de 15 % gagné.');
    }
    // Photo obligatoire : pas de clôture tant qu'une adresse à plainte du secteur attend sa photo
    manquePhoto = plaintesDe(cur).filter(function(p){ return p.photo; });
    if (manquePhoto.length) al.unshift('<div class="al red">📸 <b>Clôture impossible</b> : il manque la photo de ' +
      manquePhoto.map(function(p){ return '<b>' + esc(p.adr) + '</b>'; }).join(', ') + '. Envoie-la d’abord à ton coach.</div>');
    $('cAl').innerHTML = al.join('');
    $('cOk').textContent = manquePhoto.length ? '📸 Envoyer la photo (' + manquePhoto[0].adr + ')' : (pct != null && pct < PAYE ? 'Clôturer quand même' : 'Clôturer le secteur');
    $('cOk').className = manquePhoto.length ? 'bt g' : 'bt k';
    $('cloture').classList.add('on');
  }
  $('cBack').onclick = function(){ $('cloture').classList.remove('on'); };
  var manquePhoto = [];
  $('cOk').onclick = function(){
    $('cloture').classList.remove('on');
    if (manquePhoto.length) { photoPlainte(manquePhoto[0]); return; }
    var pct = streets.length ? compute() : null;
    stop(true); paused = false; lsDel('pause'); lsDel('on'); setCtrl('idle');
    tFin();
    if (cur) { ls('clos_' + wk() + '_' + cur.id, pct == null ? -1 : pct); etatsSrv[cur.id] = { s: cur.id, etat: 'clos', pct: pct == null ? -1 : pct }; ls('etats', etatsSrv); }
    sendProg('clos', true);
    setLive(''); if (navOn) setNav(false);
    var nomClos = cur ? cur.nom : '';
    renderHome(); show('home');
    // Dernière étape : la photo du PDA au bot WhatsApp, qui enregistre la prestation
    modal('<h4>✅ Secteur clôturé</h4><div class="sub"></div>' +
      '<div class="plinfo">📲 <b>Dernière étape :</b> envoie la photo de l’écran de ton <b>PDA</b> (secteur et semaine bien visibles) au <b>bot WhatsApp</b> pour enregistrer ta prestation.</div>' +
      '<button class="bt g" id="botGo">💬 Ouvrir le bot WhatsApp</button><button class="bt k" data-x="1">OK</button>');
    $('modBox').querySelector('.sub').textContent = nomClos ? nomClos + ' · sans cette photo, la prestation n’est pas enregistrée.' : 'Sans cette photo, la prestation n’est pas enregistrée.';
    $('botGo').onclick = function(){ ouvrir('https://wa.me/' + BOT_WA); fermer(); };
    $('modBox').querySelector('[data-x]').onclick = fermer;
  };
  var BOT_WA = '212603989457';   // numéro du bot WhatsApp des prestations
  $('me').onclick = function(){ follow = true; if (lastPos) map.setView(lastPos, navOn ? 18 : 17); };
  setInterval(function(){ flush(false); }, 30000);
  window.addEventListener('online', function(){ flush(true); flushPend(); });
  setInterval(function(){ flushPend(); if ($('home').classList.contains('on')) refreshEtats(); }, 60000);
  setCtrl('idle');

  // ---- démarrage ----
  // Saisie du lien personnel (app uniquement) : on accepte le lien complet ou juste la clé
  function askKey(){
    msg('<b style="font-size:18px">Bienvenue 👋</b><br>Colle ici le lien personnel envoyé par ton responsable.' +
      '<input id="kIn" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/secteur/?k=…" ' +
      'style="display:block;width:100%;margin:14px 0 4px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;color:#0f172a">',
      'Valider', function(){
        var v = (($('kIn') || {}).value || '').trim(), m = v.match(/[?&]k=([^&#\s]+)/);
        // Lien de la page admin ou code administrateur : ouvre le suivi des tournées (admin) dans l'appli
        if (/admin\.html/i.test(v) || /^zt-admin-/i.test(v)) {
          try { localStorage.setItem('mt_admin', '1'); if (/^zt-admin-/i.test(v)) localStorage.setItem('adm_t', v); } catch (e) {}
          location.href = 'admin.html'; return;
        }
        var k = m ? decodeURIComponent(m[1]) : (/^[\w-]{4,}$/.test(v) ? v : '');
        if (!k) { alert('Lien non reconnu. Copie le lien complet reçu par message.'); return; }
        try { localStorage.setItem('mt_key', k); } catch (e) {}
        location.reload();
      });
  }

  var modeAdmin = false; try { modeAdmin = NATIVE && localStorage.getItem('mt_admin') === '1'; } catch (e) {}
  if (!key && modeAdmin) location.href = 'admin.html';
  else if (!key && NATIVE) askKey();
  else if (!key) msg('Lien incomplet.<br>Demande ton lien à ton responsable.');
  else { flush(true); loadHome(); }
})();
</script>
