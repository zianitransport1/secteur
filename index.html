<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma tournée">
<title>Ma tournée</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{--bg:#0f172a;--card:#ffffff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pink:#ff2ec4;--green:#16a34a;--sector:#00c800;--blue:#2563eb;--amber:#d97706;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  button{font-family:inherit}
  .screen{position:fixed;inset:0;display:none;overflow:auto}
  .screen.on{display:block}

  /* ---- Liste des secteurs ---- */
  #home{background:#f1f5f9}
  .head{background:var(--bg);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px}
  .head h1{margin:0;font-size:24px;font-weight:800}
  .head p{margin:4px 0 0;color:#94a3b8;font-size:14px}
  .list{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .hint{font-size:14px;color:var(--mut);margin:4px 4px 12px}
  .card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(15,23,42,.06);font-size:16px;color:var(--ink)}
  .card .ic{width:44px;height:44px;border-radius:12px;background:#fdf2fb;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .card .tx{flex:1;min-width:0}
  .card b{display:block;font-size:17px}
  .card small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
  .card .pc{font-weight:800;color:var(--green);font-size:16px;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
  .tag.rep{background:#fef3c7;color:#92400e}
  .tag.ok{background:#dcfce7;color:#166534}
  .tag.done{background:#16a34a;color:#fff}
  .card.locked{opacity:.75;background:#f8fafc}
  .card.locked .ic{background:#dcfce7}
  .empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;color:var(--mut)}

  /* ---- Rappel code QR ---- */
  #qr{background:var(--bg);color:#fff;text-align:center}
  .qrwrap{max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
  .back{align-self:flex-start;background:none;border:0;color:#94a3b8;font-size:15px;padding:6px 0}
  .warn{background:#fbbf24;color:#0f172a;border-radius:14px;padding:12px 14px;font-weight:800;font-size:17px;margin:10px 0 6px}
  #qr h2{margin:10px 0 2px;font-size:24px}
  #qr .sub2{color:#94a3b8;font-size:14px}
  .qrbox{background:#fff;border-radius:20px;padding:18px;margin:18px auto 10px;width:100%;max-width:320px}
  .qrbox svg,.qrbox img{width:100%;height:auto;display:block}
  .code{font-size:26px;font-weight:800;letter-spacing:3px;margin:6px 0 4px;font-family:ui-monospace,Menlo,monospace}
  .noqr{background:#1e293b;border-radius:16px;padding:20px;margin:18px 0;color:#fbbf24;font-size:16px;line-height:1.4}
  .big{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 8px 24px rgba(22,163,74,.4);margin-top:auto}
  .big.grey{background:#334155;box-shadow:none}

  /* ---- Carte ---- */
  #mapRot{position:fixed;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%) rotate(0deg);transition:transform .45s ease-out}
  #map{position:absolute;inset:0;background:#e5e7eb}
  .meArrow{width:30px;height:30px;transition:transform .45s ease-out}
  .top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:500;background:var(--card);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 14px 12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .menu{border:0;background:#f1f5f9;border-radius:10px;width:38px;height:38px;font-size:18px;flex:none}
  .who{font-weight:800;font-size:18px;line-height:1.1}
  .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .pct{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--green);font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:99px;background:#fde7f7;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:99px;transition:width .6s}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:7px;flex-wrap:wrap}
  .legend b{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
  .live{display:none;margin-top:6px;font-size:12px;font-weight:600;color:var(--green)}
  .live.on{display:block}
  .live.warn{color:var(--amber)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
         padding:8px 14px calc(12px + env(safe-area-inset-bottom));max-height:45vh;display:flex;flex-direction:column;transition:max-height .3s}
  .sheet.closed{max-height:calc(58px + env(safe-area-inset-bottom))}
  .sheet.closed ul{display:none}
  .handle{width:40px;height:5px;border-radius:9px;background:#cbd5e1;margin:2px auto 8px}
  .grab{padding:4px 0 6px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
  .sheet h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
  .sheet h3 em{font-style:normal;margin-left:auto;color:var(--mut);font-size:12px}
  .sheet h3 span{color:var(--mut);font-weight:500;font-size:13px}
  .sheet ul{list-style:none;margin:0;padding:0;overflow:auto}
  .sheet li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-top:1px solid #f1f5f9;font-size:14px}
  .sheet li .n{display:flex;align-items:center;gap:8px}
  .sheet li .t{width:10px;height:10px;border-radius:3px;background:var(--pink);flex:none}
  .sheet li.done{color:var(--mut)} .sheet li.done .t{background:var(--green)} .sheet li.part .t{background:linear-gradient(90deg,var(--green) 50%,var(--pink) 50%)}
  .sheet li .a{font-size:12px;color:var(--mut)}
  .btn{position:fixed;right:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:20px}
  #me{bottom:calc(45vh + 12px)} .sheet.closed ~ #me{bottom:calc(72px + env(safe-area-inset-bottom))}
  #nav{bottom:calc(45vh + 116px)} .sheet.closed ~ #nav{bottom:calc(176px + env(safe-area-inset-bottom))}
  #fond{bottom:calc(45vh + 168px);font-size:19px} .sheet.closed ~ #fond{bottom:calc(228px + env(safe-area-inset-bottom))}
  #nav.on{background:var(--blue);color:#fff}
  #qrbtn{bottom:calc(45vh + 64px);font-size:13px;font-weight:800} .sheet.closed ~ #qrbtn{bottom:calc(124px + env(safe-area-inset-bottom))}
  .ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:600;display:flex;gap:10px;white-space:nowrap}
  .go{border:0;border-radius:99px;padding:15px 26px;font-size:17px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 8px 24px rgba(22,163,74,.45)}
  .go.stop{background:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.35);padding:11px 18px;font-size:15px}
  .go.pause{background:var(--amber);box-shadow:0 8px 24px rgba(217,119,6,.4);padding:11px 18px;font-size:15px}
  .go[hidden]{display:none}
  .sheet:not(.closed) ~ .ctrl{display:none}
  .modal{position:fixed;inset:0;z-index:950;background:rgba(15,23,42,.6);display:none;align-items:flex-end;justify-content:center;padding:12px}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:20px;padding:20px 18px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:460px}
  .modal h4{margin:0 0 4px;font-size:20px}
  .modal .big2{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0 10px}
  .modal .al{border-radius:12px;padding:11px 12px;margin:8px 0;font-size:15px;line-height:1.35}
  .modal .al.red{background:#fee2e2;color:#991b1b} .modal .al.amb{background:#fef3c7;color:#92400e} .modal .al.ok{background:#dcfce7;color:#166534}
  .modal .bt{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;margin-top:10px}
  .modal .bt.g{background:var(--green);color:#fff} .modal .bt.k{background:#f1f5f9;color:var(--ink)}
  .leaflet-control-attribution{font-size:9px}
  .msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:900;background:var(--bg);color:#fff;text-align:center;padding:30px;font-size:16px}
  .msg.on{display:flex}
  .msg button{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
  .spin{width:34px;height:34px;border-radius:50%;border:4px solid #334155;border-top-color:#fff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 1. Mes secteurs -->
<div class="screen" id="home">
  <div class="head"><h1 id="hName">Ma tournée</h1><p id="hWeek">Chargement…</p></div>
  <div class="list">
    <p class="hint">Choisis le secteur que tu commences :</p>
    <div id="cards"></div>
  </div>
</div>

<!-- 2. Rappel code QR -->
<div class="screen" id="qr">
  <div class="qrwrap">
    <button class="back" id="qrBack">← Mes secteurs</button>
    <div class="warn">📱 Scanne ce code QR avec ton PDA avant de commencer</div>
    <h2 id="qName"></h2>
    <div class="sub2" id="qInfo"></div>
    <div id="qBody"></div>
    <button class="big" id="qOk">✅ J’ai bien scanné le code QR</button>
  </div>
</div>

<!-- 3. Carte -->
<div class="screen" id="mapScreen">
  <div id="mapRot"><div id="map"></div></div>
  <div class="top">
    <div class="row">
      <button class="menu" id="toHome" title="Mes secteurs">☰</button>
      <div style="flex:1;min-width:0">
        <div class="who" id="who">Secteur</div>
        <div class="sub" id="status"></div>
      </div>
      <div style="text-align:right">
        <div class="pct" id="pct">–</div>
        <div class="sub" id="cnt"></div>
      </div>
    </div>
    <div class="live" id="live"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="legend"><span><b style="background:var(--pink)"></b>À faire</span><span><b style="background:var(--green)"></b>Fait</span><span><b style="background:var(--blue)"></b>Mon trajet</span><span><b style="background:var(--sector)"></b>Secteur</span></div>
  </div>
  <div class="sheet closed" id="sheet">
    <div class="grab" id="grab"><div class="handle"></div>
    <h3>Rues <span id="rest"></span><em id="arrow">▲</em></h3></div>
    <ul id="list"></ul>
  </div>
  <button class="btn" id="qrbtn" title="Revoir le code QR">QR</button>
  <button class="btn" id="me" title="Me centrer">◎</button>
  <button class="btn" id="nav" title="Carte dans le sens de la marche">🧭</button>
  <button class="btn" id="fond" title="Plan / Satellite">🛰️</button>
  <div class="ctrl"><button class="go pause" id="pause" hidden>⏸ Pause</button><button class="go" id="go">▶ Démarrer ma tournée</button></div>
</div>

<div class="msg" id="msg"></div>
<div class="modal" id="cloture"><div class="box">
  <h4>Clôturer le secteur ?</h4>
  <div class="sub" id="cSect"></div>
  <div class="big2" id="cPct"></div>
  <div id="cAl"></div>
  <button class="bt g" id="cBack">Continuer la tournée</button>
  <button class="bt k" id="cOk">Clôturer quand même</button>
</div></div>

<script>
(function(){
  'use strict';
  var API = 'https://ziani1.app.n8n.cloud/webhook/tournee-api';
  var SEND_EVERY = 5 * 60 * 1000;   // envoi des positions au serveur toutes les 5 min (économise les exécutions n8n)
  var R = 25, STEP = 8, DONE = 0.8; // rue faite si le chauffeur est passé à moins de 25 m sur 80 % de sa longueur
  // Dans l'app iPhone (Capacitor), le lien personnel est saisi une fois puis mémorisé sur le téléphone
  var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  function savedKey(){ try { return localStorage.getItem('mt_key') || ''; } catch (e) { return ''; } }
  var key = new URLSearchParams(location.search).get('k') || (NATIVE ? savedKey() : '');
  var NL = String.fromCharCode(10);
  var $ = function(id){ return document.getElementById(id); };
  function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('mt_' + key + '_' + k) || 'null'); localStorage.setItem('mt_' + key + '_' + k, JSON.stringify(v)); } catch (e) { return null; } }
  function lsDel(k){ try { localStorage.removeItem('mt_' + key + '_' + k); } catch (e) {} }

  function show(id){ ['home','qr','mapScreen'].forEach(function(s){ $(s).classList.toggle('on', s === id); }); if (id === 'mapScreen' && map) setTimeout(function(){ map.invalidateSize(); }, 50); }
  function msg(html, btn, fn){ var m = $('msg'); m.innerHTML = html; if (btn) { var b = document.createElement('button'); b.textContent = btn; b.onclick = fn; m.appendChild(b); } m.classList.add('on'); }
  function hideMsg(){ $('msg').classList.remove('on'); }
  // Suivi en direct (avancement, pause, clôture) : serveur séparé, géré par l'admin
  var SUIVI = 'https://ziani1.app.n8n.cloud/webhook/tournee-suivi';
  function suivi(body){
    body.k = key;
    return fetch(SUIVI, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(body), cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('serveur'); return r.json(); });
  }
  var etatsSrv = ls('etats') || {};   // { idSecteur: { etat: 'clos' | 'rouvert' | 'en cours' | 'pause', pct } }
  function setEtats(d){ var m = {}; ((d && d.etats) || []).forEach(function(e){ m[e.s] = e; }); etatsSrv = m; ls('etats', m); }
  function clos(id){
    var e = etatsSrv[id];
    if (e && e.etat === 'rouvert') { lsDel('clos_' + wk() + '_' + id); return null; }
    if (e && e.etat === 'clos') return e.pct;
    var l = ls('clos_' + wk() + '_' + id); return l == null ? null : l;
  }
  // envois en attente (clôture faite sans réseau) : renvoyés dès que possible
  function sendSuivi(body, sur){
    var q = ls('pend') || [];
    return suivi(JSON.parse(JSON.stringify(body))).then(function(d){ setEtats(d); return d; }).catch(function(){
      if (sur) { q.push(body); ls('pend', q.slice(-20)); } });
  }
  function flushPend(){
    var q = ls('pend') || []; if (!q.length) return;
    lsDel('pend'); q.forEach(function(b){ sendSuivi(b, true); });
  }
  function refreshEtats(){ return suivi({ a:'prog' }).then(function(d){ setEtats(d); if ($('home').classList.contains('on') && data) renderHome(); }).catch(function(){}); }
  function api(body){
    body.k = key;
    return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(body), cache:'no-store' })
      .then(function(r){ if (r.status === 404) throw new Error('lien'); if (!r.ok) throw new Error('serveur'); return r.json(); });
  }

  // ================= 1. Liste des secteurs =================
  var data = null, cur = null;
  function wk(){ return data ? data.annee + '-' + data.semaine : ''; }
  function renderHome(){
    $('hName').textContent = 'Bonjour ' + (data.chauffeur || '').split(' ')[0] + ' 👋';
    $('hWeek').textContent = 'Semaine ' + data.semaine + ' · ' + data.secteurs.length + ' secteur' + (data.secteurs.length > 1 ? 's' : '');
    document.title = 'Ma tournée';
    var box = $('cards'); box.innerHTML = '';
    if (!data.secteurs.length) { box.innerHTML = '<div class="empty">Aucun secteur ne t’est attribué cette semaine.<br>Demande à ton responsable.</div>'; return; }
    data.secteurs.forEach(function(s){
      var b = document.createElement('button'); b.className = 'card';
      var p = ls('pct_' + wk() + '_' + s.id), cp = clos(s.id);
      b.innerHTML = '<span class="ic">📍</span><span class="tx"><b></b><small></small></span><span class="pc"></span>';
      b.querySelector('b').textContent = s.nom;
      if (s.remplacement) b.querySelector('b').insertAdjacentHTML('beforeend', '<span class="tag rep">Remplacement</span>');
      if (cp != null) { b.className = 'card locked'; b.querySelector('.ic').textContent = '✅'; b.querySelector('b').insertAdjacentHTML('beforeend', '<span class="tag done">Clôturé</span>'); if (cp >= 0) p = cp; }
      else if (ls('scan_' + wk() + '_' + s.id)) b.querySelector('b').insertAdjacentHTML('beforeend', '<span class="tag ok">QR scanné</span>');
      b.querySelector('small').textContent = (s.boites ? s.boites + ' boîtes' : 'Pas de bon BD Media cette semaine') + (s.kml ? '' : ' · carte pas encore disponible');
      b.querySelector('.pc').textContent = p != null ? p + ' %' : '›';
      b.onclick = function(){
        var c = clos(s.id);
        if (c != null) { msg('✅ <b>' + s.nom.replace(/</g, '') + '</b> est clôturé' + (c >= 0 ? ' à ' + c + ' %' : '') + '.<br><br>Pour le rouvrir, demande à ton responsable.', 'OK', hideMsg); return; }
        openQr(s);
      };
      box.appendChild(b);
    });
  }
  function loadHome(){
    msg('<div class="spin"></div>Chargement de tes secteurs…');
    api({ a:'init' }).then(function(d){ data = d; ls('init', d); hideMsg(); renderHome(); show('home'); flushPend(); refreshEtats(); })
      .catch(function(e){
        if (e.message === 'lien') {
          if (NATIVE) return msg('Ce lien n’est pas valide.<br>Demande ton lien à ton responsable.', 'Saisir un autre lien', askKey);
          return msg('Ce lien n’est pas valide.<br>Demande ton lien à ton responsable.');
        }
        var c = ls('init'); if (c) { data = c; hideMsg(); renderHome(); show('home'); return; }
        msg('Pas de connexion internet.', 'Réessayer', loadHome);
      });
  }

  // ================= 2. Rappel code QR =================
  function openQr(s){
    cur = s;
    $('qName').textContent = s.nom;
    $('qInfo').textContent = 'Semaine ' + data.semaine + (s.num ? ' · secteur ' + s.num : '') + (s.boites ? ' · ' + s.boites + ' boîtes' : '');
    var body = $('qBody');
    if (s.code && window.qrcode) {
      var q = qrcode(0, 'M'); q.addData(s.code); q.make();
      body.innerHTML = '<div class="qrbox">' + q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }) + '</div><div class="code"></div><div class="sub2">Code de notification BD Media</div>';
      body.querySelector('.code').textContent = s.code;
      $('qOk').textContent = '✅ J’ai bien scanné le code QR'; $('qOk').className = 'big';
    } else {
      body.innerHTML = '<div class="noqr">⚠️ Le code QR de ce secteur n’est pas encore disponible pour la semaine ' + data.semaine + '.<br><br>Scanne le code QR du bon papier avec ton PDA, ou préviens ton responsable.</div>';
      $('qOk').textContent = 'J’ai scanné le bon papier → continuer'; $('qOk').className = 'big grey';
    }
    show('qr'); $('qr').scrollTop = 0;
  }
  $('qrBack').onclick = function(){ if (map && cur && sectorLoaded === cur.id) show('mapScreen'); else { renderHome(); show('home'); } };
  $('qOk').onclick = function(){ ls('scan_' + wk() + '_' + cur.id, Date.now()); openMap(cur); };

  // ================= 3. Carte + suivi =================
  var map = null, gSector, gStreets, gTrace, gMe, sectorLoaded = null;
  var streets = [], sectorPoly = null, serverPts = [], first = true, lastPos = null, follow = true;
  function initMap(){
    if (map) return;
    map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([50.85, 4.3], 14);
    // Fonds de carte : plan clair (maisons visibles en zoomant) ou satellite (photo aérienne + noms de rues)
    var ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    FONDS = {
      plan: L.tileLayer(ESRI + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Tiles © Esri' }),
      sat: L.layerGroup([
        L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Imagerie © Esri' }),
        L.tileLayer(ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 }),

    if (cur) { ls('clos_' + wk() + '_' + cur.id, pct == null ? -1 : pct); etatsSrv[cur.id] = { s: cur.id, etat: 'clos', pct: pct == null ? -1 : pct }; ls('etats', etatsSrv); }
    sendProg('clos', true);
    setLive(''); if (navOn) setNav(false);
    renderHome(); show('home');
  };
  $('me').onclick = function(){ follow = true; if (lastPos) map.setView(lastPos, navOn ? 18 : 17); };
  setInterval(function(){ flush(false); }, 30000);
  window.addEventListener('online', function(){ flush(true); flushPend(); });
  setInterval(function(){ flushPend(); if ($('home').classList.contains('on')) refreshEtats(); }, 60000);
  setCtrl('idle');

  // ---- démarrage ----
  // Saisie du lien personnel (app uniquement) : on accepte le lien complet ou juste la clé
  function askKey(){
    msg('<b style="font-size:18px">Bienvenue 👋</b><br>Colle ici le lien personnel envoyé par ton responsable.' +
      '<input id="kIn" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/secteur/?k=…" ' +
      'style="display:block;width:100%;margin:14px 0 4px;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;color:#0f172a">',
      'Valider', function(){
        var v = (($('kIn') || {}).value || '').trim(), m = v.match(/[?&]k=([^&#\s]+)/);
        var k = m ? decodeURIComponent(m[1]) : (/^[\w-]{4,}$/.test(v) ? v : '');
        if (!k) { alert('Lien non reconnu. Copie le lien complet reçu par message.'); return; }
        try { localStorage.setItem('mt_key', k); } catch (e) {}
        location.reload();
      });
  }

  if (!key && NATIVE) askKey();
  else if (!key) msg('Lien incomplet.<br>Demande ton lien à ton responsable.');
  else { flush(true); loadHome(); }
})();
</script>
</body>
</html>
