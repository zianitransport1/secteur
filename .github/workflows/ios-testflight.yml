# Compile l'app iPhone « Ma tournée » sur un Mac de GitHub et l'envoie sur TestFlight.
# Lancement manuel : onglet Actions > « App iPhone → TestFlight » > Run workflow.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   APPLE_TEAM_ID   identifiant d'équipe Apple (10 caractères, page Membership)
#   ASC_KEY_ID      ID de la clé API App Store Connect
#   ASC_ISSUER_ID   Issuer ID de la clé API
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8 (rôle Admin)
name: App iPhone → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché (ex. 1.0)"
        required: true
        default: "1.0"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      BUNDLE_ID: com.zianitransport.matournee
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$K" ] || missing="$missing ASC_KEY_ID"
          [ -n "$I" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choisir Xcode
        run: |
          # Apple exige le SDK le plus récent : on prend le Xcode stable le plus récent du Mac
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta' | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer la page embarquée
        run: npm run www

      - name: Créer le projet iOS
        run: |
          npx cap add ios
          npx cap sync ios
          npm run ios:configure

      - name: Clé API App Store Connect
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"

      # Archive non signée : la signature App Store est faite à l'étape suivante (export),
      # ce qui évite d'avoir besoin d'un iPhone enregistré pour un profil de développement.
      - name: Compiler (archive)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 40

      - name: Envoyer sur TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KID.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "### ✅ Version ${{ inputs.version }} (build ${{ github.run_number }}) envoyée à App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Elle apparaît dans TestFlight après le traitement par Apple (15-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
