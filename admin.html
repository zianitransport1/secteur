<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<title>Suivi des tournées</title>
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#0f172a;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#2563eb;--soft:#f1f5f9}
  *{box-sizing:border-box}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--soft);color:var(--ink)}
  button,input,select{font-family:inherit;font-size:15px}
  header{background:var(--bg);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:5}
  header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:800;flex:1;min-width:200px}
  header h1 small{display:block;font-size:13px;font-weight:500;color:#94a3b8;margin-top:3px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8}
  .live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pu 2s infinite}
  .live.err i{background:var(--amber);animation:none}
  @keyframes pu{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .tile span{font-size:13px;color:var(--mut)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .seg{display:flex;background:#e2e8f0;border-radius:12px;padding:3px;flex-wrap:wrap}
  .seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-width:0}
  .tools input{flex:1;min-width:160px}
  h2{font-size:16px;margin:22px 0 10px}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.6fr) 96px;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .row .n b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n small,.row .c small{color:var(--mut);font-size:12px}
  .row .c{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:10px;border-radius:99px;background:#eef2f7;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
  .p{display:flex;align-items:center;gap:10px}
  .p .bar{flex:1}
  .p b{font-variant-numeric:tabular-nums;min-width:46px;text-align:right;font-size:16px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .t-clos{background:#dcfce7;color:#166534}.t-cours{background:#dbeafe;color:#1e40af}.t-pause{background:#fef3c7;color:#92400e}
  .t-rouvert{background:#ede9fe;color:#5b21b6}.t-pas{background:#f1f5f9;color:var(--mut)}.t-bonus{background:#fef9c3;color:#854d0e;margin-left:4px}
  .act{display:flex;gap:6px;align-items:center;justify-content:flex-end}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn[disabled]{opacity:.5}
  .drivers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .drv{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .drv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw{position:relative;width:46px;height:28px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw i{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
  .sw i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked + i{background:var(--green)}
  .sw input:checked + i:before{transform:translateX(18px)}
  .hint{font-size:13px;color:var(--mut);margin:-4px 0 10px}
  .empty{background:#fff;border-radius:14px;padding:22px;text-align:center;color:var(--mut)}
  .login{max-width:380px;margin:12vh auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.1)}
  .login h1{margin:0 0 8px;font-size:22px}
  .login input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}
  .login .btn{width:100%;padding:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
  .toast.on{opacity:1}
  .wk{border:0;border-radius:12px;padding:9px 12px;font-weight:700;background:#1e293b;color:#fff}
  .row .c select{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:14px}
  .row .c select.mod{border-color:#a78bfa;background:#f5f3ff}
  .row .n{cursor:pointer}
  .row .n b:after{content:" 🗺";font-size:13px;opacity:.55}
  .t-mod{background:#ede9fe;color:#5b21b6;margin-left:4px}
  details.libres{margin-top:18px}
  details.libres summary{cursor:pointer;font-weight:700;font-size:16px;padding:6px 0}
  .lib{background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:8px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .lib select{border:1px solid var(--line);border-radius:10px;padding:7px 8px;max-width:55%}
  .lib small{color:var(--mut)}
  #carte{position:fixed;inset:0;z-index:30;background:#e5e7eb;display:none}
  #carte.on{display:block}
  #cmap{position:absolute;inset:0}
  .ctop{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:500;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 14px 12px;max-width:640px;margin:0 auto}
  .ctop .r{display:flex;align-items:center;gap:10px}
  .ctop .x{border:0;background:var(--soft);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
  .ctop .t{flex:1;min-width:0}.ctop .t b{display:block;font-size:17px}.ctop .t small{color:var(--mut);font-size:12px}
  .ctop .pc{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
  .ctop .lg{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
  .ctop .lg i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
  .cbtn{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:500;width:46px;height:46px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
  .cmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:600;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.2);font-size:15px;display:none}
  .cmsg.on{display:block}
  @media (max-width:760px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n act" "c c" "p p";gap:8px}
    .row .n{grid-area:n}.row .c{grid-area:c}.row .p{grid-area:p}.row .act{grid-area:act}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var API = 'https://ziani1.app.n8n.cloud/webhook/tournee-suivi';
  var PAYE = 90, B10 = 95, B15 = 98;
  var $app = document.getElementById('app');
  function $(id){ return document.getElementById(id); }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem('adm_' + k); if (v === null) localStorage.removeItem('adm_' + k); else localStorage.setItem('adm_' + k, v); } catch (e) { return null; } }
  var tok = new URLSearchParams(location.search).get('t') || store('t') || '';
  if (new URLSearchParams(location.search).get('t')) { store('t', tok); history.replaceState(null, '', location.pathname); }
  var data = null, filtre = store('f') || 'tous', st = store('st') || '', q = '', busy = false, w = 0;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function(){ e.classList.remove('on'); }, 2600); }
  function call(body){
    body.t = tok;
    return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(body), cache:'no-store' })
      .then(function(r){ if (r.status === 403) throw new Error('code'); if (!r.ok) throw new Error('serveur'); return r.json(); });
  }
  // ---- semaines de tournée : du vendredi 12 h au vendredi 12 h (heure de Bruxelles), numéro = semaine des bons BD Media ----
  // Bascule à midi : une tournée du jeudi soir terminée après minuit reste dans sa semaine (même règle que le serveur)
  function isoWeek(d){ var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
  function semaineDe(off){
    var b = new Date(Date.now() - 12 * 3600e3), p = {};
    try { new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Brussels', year: 'numeric', month: 'numeric', day: 'numeric' })
      .formatToParts(b).forEach(function(x){ p[x.type] = +x.value; }); } catch (e) {}
    var d = p.year ? new Date(p.year, p.month - 1, p.day) : new Date(b.getFullYear(), b.getMonth(), b.getDate());
    d.setDate(d.getDate() - ((d.getDay() - 5 + 7) % 7) + off * 7);
    var lun = new Date(d); lun.setDate(d.getDate() + 3); var jeu = new Date(d); jeu.setDate(d.getDate() + 6);
    var f = function(x){ return ('0' + x.getDate()).slice(-2) + '/' + ('0' + (x.getMonth() + 1)).slice(-2); };
    return { n: isoWeek(lun), du: f(d), au: f(jeu) };
  }
  var WEEKS = [1, 0, -1, -2, -3];
  function login(err){
    $app.innerHTML = '<div class="login"><h1>Suivi des tournées</h1><div class="hint">Accès réservé · entre ton code administrateur.</div>' +
      (err ? '<div class="tag t-pause" style="margin-top:8px">Code incorrect</div>' : '') +
      '<input id="code" type="password" autocomplete="current-password" placeholder="Code administrateur"><button class="btn blue" id="go">Entrer</button></div>';
    var go = function(){ tok = $('code').value.trim(); if (!tok) return; store('t', tok); load(true); };
    $('go').onclick = go;
    $('code').onkeydown = function(e){ if (e.key === 'Enter') go(); };
  }
  function ago(iso){
    if (!iso) return ''; var m = Math.round((Date.now() - (typeof iso === 'number' ? iso : Date.parse(iso))) / 60000);
    if (m < 1) return 'à l’instant'; if (m < 60) return 'il y a ' + m + ' min'; var h = Math.floor(m / 60);
    if (h < 24) return 'il y a ' + h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); return 'il y a ' + Math.floor(h / 24) + ' j';
  }
  function couleur(p){ return p == null ? '#cbd5e1' : (p < PAYE ? 'var(--red)' : (p < B10 ? 'var(--amber)' : 'var(--green)')); }
  var ETATS = { 'clos': ['Clôturé', 't-clos'], 'en cours': ['En cours', 't-cours'], 'pause': ['En pause', 't-pause'], 'rouvert': ['Rouvert', 't-rouvert'], 'pas commencé': ['Pas commencé', 't-pas'] };
  function shell(){
    if ($('list')) return;
    $app.innerHTML = '<header><div class="in"><h1>Suivi des tournées <small id="sub"></small></h1>' +
      '<select class="wk" id="wk"></select><span class="live" id="live"><i></i><span id="liveT">En direct</span></span>' +
      '<button class="btn" id="refresh">↻ Actualiser</button></div></header><main>' +
      '<div class="tiles" id="tiles"></div>' +
      '<div class="tools"><div class="seg" id="seg"></div><select id="st"></select><input id="q" type="search" placeholder="Chercher un secteur ou un chauffeur"></div>' +
      '<div class="list" id="list"></div>' +
      '<details class="libres" id="libresBox"><summary id="libresT"></summary><div class="hint" id="libresH"></div><div id="libres"></div></details>' +
      '<h2>Bonus de couverture</h2><div class="hint">Activé = le chauffeur voit les seuils 95 % (bonus 10 %) et 98 % (bonus 15 %) en clôturant. Le paiement à 90 % s’applique à tout le monde.</div>' +
      '<div class="drivers" id="drivers"></div></main>';
    $('wk').innerHTML = WEEKS.map(function(o){ var s = semaineDe(o);
      return '<option value="' + o + '">Semaine ' + s.n + (o === 1 ? ' · à venir' : o === 0 ? ' · en cours' : '') + ' (' + s.du + ' → ' + s.au + ')</option>'; }).join('');
    $('wk').value = String(w);
    $('wk').onchange = function(e){ w = +e.target.value; data = null; load(true); };
    $('refresh').onclick = function(){ load(); };
    $('q').oninput = function(e){ q = e.target.value.toLowerCase(); renderList(); };
    $('st').onchange = function(e){ st = e.target.value; store('st', st); renderList(); };
  }
  function editable(){ return w >= 0; }
  function optionsChauffeurs(sel){
    return '<option value="__none"' + (sel === '' ? ' selected' : '') + '>— Personne —</option>' +
      data.chauffeurs.filter(function(c){ return !/^test /i.test(c.nom) || c.id === sel; }).map(function(c){
        return '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nom) + '</option>'; }).join('');
  }
  function render(){
    shell();
    $('sub').textContent = 'Semaine ' + data.semaine + ' · du ' + data.debut.split('-').reverse().slice(0, 2).join('/') + ' au ' + data.fin.split('-').reverse().slice(0, 2).join('/') +
      ' · mis à jour ' + new Date(data.maj).toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' });
    var S = data.secteurs, n = S.length, clos = S.filter(function(s){ return s.etat === 'clos'; }).length,
        actifs = S.filter(function(s){ return s.etat === 'en cours' || s.etat === 'rouvert'; }).length,
        withP = S.filter(function(s){ return s.pct != null; }), moy = withP.length ? Math.round(withP.reduce(function(a, s){ return a + s.pct; }, 0) / withP.length) : null;
    $('tiles').innerHTML =
      '<div class="tile"><b>' + n + '</b><span>secteurs attribués</span></div>' +
      '<div class="tile"><b style="color:var(--blue)">' + actifs + '</b><span>en cours' + (w === 0 ? ' maintenant' : '') + '</span></div>' +
      '<div class="tile"><b style="color:var(--green)">' + clos + '</b><span>clôturés</span></div>' +
      '<div class="tile"><b>' + (moy == null ? '–' : moy + ' %') + '</b><span>avancement moyen</span></div>';
    var sts = {}; S.concat(data.libres).forEach(function(s){ if (s.sousTraitant) sts[s.sousTraitant] = 1; });
    $('st').innerHTML = '<option value="">Tous les sous-traitants</option>' + Object.keys(sts).sort().map(function(k){ return '<option' + (k === st ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('');
    var F = [['tous', 'Tous'], ['actifs', 'En cours'], ['clos', 'Clôturés'], ['pas', 'Pas commencés'], ['mod', 'Modifiés']];
    $('seg').innerHTML = F.map(function(f){ return '<button data-f="' + f[0] + '" class="' + (filtre === f[0] ? 'on' : '') + '">' + f[1] + '</button>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(b){ b.onclick = function(){ filtre = b.dataset.f; store('f', filtre); render(); }; });
    renderList();
    var lib = data.libres.filter(function(l){ return !st || l.sousTraitant === st; });
    $('libresT').textContent = 'Secteurs sans chauffeur cette semaine (' + lib.length + ')';
    $('libresH').textContent = editable() ? 'Choisis un chauffeur pour lui donner ce secteur pour la semaine ' + data.semaine + ' uniquement.' : 'Semaine passée : lecture seule.';
    $('libres').innerHTML = lib.map(function(l){
      return '<div class="lib"><div><b>' + esc(l.nom) + '</b><br><small>' + esc(l.sousTraitant || '') + (l.retire ? (l.sousTraitant ? ' · ' : '') + 'retiré cette semaine (habituel : ' + esc(l.habituel || '—') + ')' : '') + '</small></div>' +
        (editable() ? '<select data-s="' + l.secteur + '" data-nom="' + esc(l.nom) + '" data-mod="' + (l.retire ? 1 : 0) + '"><option value="">Affecter…</option>' +
          (l.retire ? '<option value="__defaut">↺ Remettre le chauffeur habituel</option>' : '') + optionsChauffeurs('__x').replace('<option value="__none">— Personne —</option>', '') + '</select>' : '') + '</div>';
    }).join('') || '<div class="hint">Aucun.</div>';
    Array.prototype.forEach.call(document.querySelectorAll('#libres select'), function(sel){ sel.onchange = function(){ if (sel.value) affecter(sel); }; });
    $('drivers').innerHTML = data.chauffeurs.filter(function(c){ return !/^test /i.test(c.nom); }).map(function(c){
      return '<label class="drv"><span>' + esc(c.nom) + '</span><span class="sw"><input type="checkbox" data-id="' + c.id + '"' + (c.bonus ? ' checked' : '') + '><i></i></span></label>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#drivers input'), function(i){ i.onchange = function(){ setBonus(i); }; });
  }
  function renderList(){
    var ordre = { 'en cours': 0, 'rouvert': 1, 'pause': 2, 'pas commencé': 3, 'clos': 4 };
    var L = data.secteurs.filter(function(s){
      if (st && s.sousTraitant !== st) return false;
      if (filtre === 'actifs' && !(s.etat === 'en cours' || s.etat === 'pause' || s.etat === 'rouvert')) return false;
      if (filtre === 'clos' && s.etat !== 'clos') return false;
      if (filtre === 'pas' && s.etat !== 'pas commencé') return false;
      if (filtre === 'mod' && !s.modifie) return false;
      if (q && (s.nom + ' ' + s.chauffeur).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function(a, b){ return (ordre[a.etat] - ordre[b.etat]) || ((b.pct || 0) - (a.pct || 0)) || a.nom.localeCompare(b.nom); });
    var el = $('list');
    if (!L.length) { el.innerHTML = '<div class="empty">Aucun secteur pour ce filtre.</div>'; return; }
    el.innerHTML = L.map(function(s, i){
      var e = ETATS[s.etat] || [s.etat, 't-pas'], p = s.pct;
      var ch = editable()
        ? '<select class="' + (s.modifie ? 'mod' : '') + '" data-s="' + s.secteur + '" data-nom="' + esc(s.nom) + '" data-mod="' + (s.modifie ? 1 : 0) + '">' +
            (s.modifie ? '<option value="__defaut">↺ Habituel : ' + esc(s.habituel || 'personne') + '</option>' : '') + optionsChauffeurs(s.chauffeurId) + '</select>'
        : esc(s.chauffeur);
      return '<div class="row"><div class="n" data-i="' + i + '"><b>' + esc(s.nom) + (s.remplacement ? ' <span class="tag t-pause">Remplacement</span>' : '') + '</b><small>' + esc(s.sousTraitant || '') + (s.kml ? '' : (s.sousTraitant ? ' · ' : '') + 'pas de carte') + '</small></div>' +
        '<div class="c">' + ch + '<small>' + (s.bonus ? '<span class="tag t-bonus" style="margin:4px 4px 0 0">Bonus</span>' : '') + (s.modifie ? '<span class="tag t-mod" style="margin:4px 4px 0 0">Changé cette semaine</span>' : '') + (s.maj ? ago(s.maj) : '') + '</small></div>' +
        '<div class="p"><span class="tag ' + e[1] + '">' + e[0] + '</span><div class="bar"><i style="width:' + (p || 0) + '%;background:' + couleur(p) + '"></i></div><b style="color:' + couleur(p) + '">' + (p == null ? '–' : p + ' %') + '</b></div>' +
        '<div class="act">' + (s.etat === 'clos' ? '<button class="btn blue" data-cle="' + esc(s.cle) + '" data-nom="' + esc(s.nom) + '" data-ch="' + esc(s.chauffeur) + '">Rouvrir</button>' : '') + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('button[data-cle]'), function(b){ b.onclick = function(){ rouvrir(b); }; });
    Array.prototype.forEach.call(el.querySelectorAll('.c select'), function(sel){ sel.onchange = function(){ affecter(sel); }; });
    Array.prototype.forEach.call(el.querySelectorAll('.n'), function(n){ n.onclick = function(){ ouvrirCarte(L[+n.dataset.i]); }; });
  }
  function affecter(sel){
    var v = sel.value, nom = sel.dataset.nom, body;
    if (v === '__defaut') body = { a:'defaut', s: sel.dataset.s, w: w };
    else {
      var c = data.chauffeurs.filter(function(x){ return x.id === v; })[0];
      body = { a:'affecter', s: sel.dataset.s, nom: nom, w: w, chauffeurId: v === '__none' ? '' : v, chauffeur: c ? c.nom : '' };
    }
    sel.disabled = true;
    call(body).then(function(){
      toast(v === '__defaut' ? nom + ' : chauffeur habituel remis' : v === '__none' ? nom + ' retiré pour la semaine ' + data.semaine : nom + ' → ' + body.chauffeur + ' (semaine ' + data.semaine + ')');
      load();
    }).catch(function(){ sel.disabled = false; toast('Échec, réessaie'); });
  }
  function rouvrir(b){
    if (!confirm('Rouvrir « ' + b.dataset.nom + ' » pour ' + b.dataset.ch + ' ?\nLe chauffeur pourra à nouveau ouvrir le secteur et continuer sa tournée.')) return;
    b.disabled = true;
    call({ a:'rouvrir', cle: b.dataset.cle }).then(function(){ toast('Secteur rouvert pour ' + b.dataset.ch); load(); })
      .catch(function(){ b.disabled = false; toast('Échec, réessaie'); });
  }
  function setBonus(i){
    var on = i.checked; i.disabled = true;
    call({ a:'bonus', chauffeurId: i.dataset.id, on: on }).then(function(){
      data.chauffeurs.forEach(function(c){ if (c.id === i.dataset.id) c.bonus = on; });
      data.secteurs.forEach(function(s){ if (s.chauffeurId === i.dataset.id) s.bonus = on; });
      renderList(); toast('Bonus ' + (on ? 'activé' : 'désactivé') + ' · aussi mis à jour dans Notion');
    }).catch(function(){ i.checked = !on; toast('Échec, réessaie'); }).then(function(){ i.disabled = false; });
  }

  // ================= Carte d'un secteur (comme le chauffeur la voit) =================
  var R = 25, STEP = 8, DONE = 0.8, KY = 110574, KX = 70300;
  var cmap = null, gSec, gTodo, gDone, gMe, fonds = null, fond = 'sat', carteS = null, carteTimer = null, carteFirst = true;
  function chargerLeaflet(){
    if (window.L) return Promise.resolve();
    return new Promise(function(ok, ko){
      var c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
    });
  }
  function xy(p){ return [p[1] * KX, p[0] * KY]; }
  function parseKml(txt){
    var doc = new DOMParser().parseFromString(txt, 'text/xml'), out = { poly: null, streets: [] }, pms = doc.getElementsByTagName('Placemark');
    function coords(el){ return (el.textContent || '').trim().split(/\s+/).map(function(t){ var p = t.split(','); return [+p[1], +p[0]]; }).filter(function(p){ return !isNaN(p[0]) && !isNaN(p[1]); }); }
    for (var i = 0; i < pms.length; i++) {
      var pm = pms[i], nm = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
      var poly = pm.getElementsByTagName('Polygon')[0], line = pm.getElementsByTagName('LineString')[0];
      if (poly) { var c = poly.getElementsByTagName('coordinates')[0]; if (c && !out.poly) out.poly = coords(c); }
      else if (line) { var c2 = line.getElementsByTagName('coordinates')[0]; if (c2) out.streets.push({ name: nm.replace(/^D\d+\s*[–-]\s*/, '').replace(/\s*\(\d+\)\s*$/, '').trim(), ll: coords(c2) }); }
    }
    return out;
  }
  function calc(streets, pts){
    var grid = {};
    pts.forEach(function(p){ var q = xy(p), k = Math.floor(q[0] / R) + ':' + Math.floor(q[1] / R); (grid[k] = grid[k] || []).push(q); });
    function near(x, y){ var cx = Math.floor(x / R), cy = Math.floor(y / R);
      for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++) { var c = grid[(cx+i) + ':' + (cy+j)]; if (c) for (var n = 0; n < c.length; n++) { var dx = c[n][0]-x, dy = c[n][1]-y; if (dx*dx + dy*dy <= R*R) return true; } }
      return false; }
    var tot = 0, done = 0, nd = 0;
    streets.forEach(function(s){
      var samp = [];
      for (var i = 1; i < s.ll.length; i++) { var a = s.ll[i-1], b = s.ll[i], A = xy(a), B = xy(b), L0 = Math.hypot(B[0]-A[0], B[1]-A[1]), n = Math.max(1, Math.ceil(L0 / STEP));
        for (var t = (i === 1 ? 0 : 1); t <= n; t++) { var f = t / n; samp.push({ ll: [a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f], x: A[0] + (B[0]-A[0]) * f, y: A[1] + (B[1]-A[1]) * f }); } }
      var Lt = 0, Ld = 0, runs = [], cur = null;
      samp.forEach(function(p, i){ p.ok = near(p.x, p.y);
        if (i > 0) { var q = samp[i-1], d = Math.hypot(p.x - q.x, p.y - q.y); Lt += d; if (p.ok && q.ok) Ld += d; else if (p.ok || q.ok) Ld += d / 2; }
        if (!cur || cur.ok !== p.ok) { if (cur) cur.c.push(p.ll); cur = { ok: p.ok, c: [p.ll] }; runs.push(cur); } else cur.c.push(p.ll); });
      s.runs = runs; if (Lt && Ld / Lt >= DONE) nd++; tot += Lt; done += Ld;
    });
    return { pct: tot ? Math.round(done / tot * 100) : 0, faites: nd };
  }
  function setFond(f){
    if (fonds[fond]) cmap.removeLayer(fonds[fond]); fond = f; fonds[f].addTo(cmap); $('cfond').textContent = f === 'sat' ? '🗺️' : '🛰️';
  }
  function ouvrirCarte(s){
    carteS = s; carteFirst = true;
    $('carte').classList.add('on');
    $('ctitre').textContent = s.nom; $('csub').textContent = s.chauffeur + ' · semaine ' + data.semaine;
    $('cpct').textContent = '…'; $('cpct').style.color = '';
    cmsg('Chargement de la carte…');
    chargerLeaflet().then(function(){
      if (!cmap) {
        cmap = L.map('cmap', { zoomControl: false, maxZoom: 20 }).setView([50.85, 4.3], 13);
        var E = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
        fonds = { plan: L.tileLayer(E + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Tiles © Esri' }),
          sat: L.layerGroup([L.tileLayer(E + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Imagerie © Esri' }),
            L.tileLayer(E + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 }),
            L.tileLayer(E + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 })]) };
        fonds[fond].addTo(cmap);
        cmap.createPane('pTodo').style.zIndex = 410; cmap.createPane('pDone').style.zIndex = 430; cmap.createPane('pMe').style.zIndex = 640;
        gSec = L.layerGroup().addTo(cmap); gTodo = L.layerGroup().addTo(cmap); gDone = L.layerGroup().addTo(cmap); gMe = L.layerGroup().addTo(cmap);
      }
      setTimeout(function(){ cmap.invalidateSize(); }, 50);
      chargerCarte();
      clearInterval(carteTimer); if (w === 0) carteTimer = setInterval(chargerCarte, 60000);
    }).catch(function(){ cmsg('Impossible de charger la carte.'); });
  }
  function cmsg(t){ var m = $('cmsg'); m.textContent = t || ''; m.classList.toggle('on', !!t); }
  function chargerCarte(){
    var s = carteS; if (!s) return;
    call({ a:'carte', s: s.secteur, traccarId: s.traccarId || 0, w: w }).then(function(d){
      if (carteS !== s) return;
      gSec.clearLayers(); gTodo.clearLayers(); gDone.clearLayers(); gMe.clearLayers();
      if (!d.kml) { cmsg('Pas de carte KML pour ce secteur dans Notion.'); $('cpct').textContent = '–'; return; }
      cmsg('');
      var k = parseKml(d.kml), pts = (d.trace || []).map(function(p){ return [p[0], p[1]]; }), r = calc(k.streets, pts);
      if (k.poly) L.polygon(k.poly, { color:'#00c800', weight:4, fillColor:'#00c800', fillOpacity:.06, interactive:false }).addTo(gSec);
      k.streets.forEach(function(st){ st.runs.forEach(function(run){ if (run.c.length > 1)
        L.polyline(run.c, run.ok ? { pane:'pDone', color:'#16a34a', weight:11, opacity:1, lineCap:'round', lineJoin:'round' }
                                 : { pane:'pTodo', color:'#ff2ec4', weight:8, opacity:.95, lineCap:'round', lineJoin:'round' }).bindTooltip(st.name).addTo(run.ok ? gDone : gTodo); }); });
      $('cpct').textContent = r.pct + ' %'; $('cpct').style.color = couleur(r.pct);
      var names = {}; k.streets.forEach(function(x){ names[x.name] = 1; });
      $('csub').textContent = s.chauffeur + ' · semaine ' + data.semaine + ' · ' + r.faites + ' / ' + k.streets.length + ' tronçons faits';
      var dern = d.dernier;
      if (dern) {
        L.circleMarker([dern.lat, dern.lon], { pane:'pMe', radius:10, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1 })
          .bindTooltip(s.chauffeur + ' · ' + ago(dern.t), { permanent: true, direction: 'top', offset: [0, -10] }).addTo(gMe);
        $('cpos').textContent = 'Dernière position : ' + ago(dern.t);
      } else $('cpos').textContent = s.traccarId ? 'Aucune position cette semaine' : 'Le chauffeur n’a pas encore envoyé de position';
      if (carteFirst) { carteFirst = false; var b = k.poly ? L.polygon(k.poly).getBounds() : L.polyline(k.streets.map(function(x){ return x.ll; })).getBounds(); cmap.fitBounds(b, { padding: [30, 30] }); }
    }).catch(function(){ cmsg('Pas de connexion au serveur.'); });
  }
  function fermerCarte(){ $('carte').classList.remove('on'); carteS = null; clearInterval(carteTimer); }
  document.body.insertAdjacentHTML('beforeend', '<div id="carte"><div id="cmap"></div>' +
    '<div class="ctop"><div class="r"><button class="x" id="cclose" title="Fermer">✕</button><div class="t"><b id="ctitre"></b><small id="csub"></small></div><div class="pc" id="cpct"></div></div>' +
    '<div class="lg"><span><i style="background:#ff2ec4"></i>À faire</span><span><i style="background:#16a34a"></i>Fait</span><span><i style="background:#2563eb;height:8px;width:8px;border-radius:50%"></i><span id="cpos"></span></span></div></div>' +
    '<button class="cbtn" id="cfond" title="Plan / Satellite">🗺️</button><div class="cmsg" id="cmsg"></div></div>');
  $('cclose').onclick = fermerCarte;
  $('cfond').onclick = function(){ if (cmap) setFond(fond === 'sat' ? 'plan' : 'sat'); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fermerCarte(); });

  function load(first){
    if (!tok) return login();
    if (busy) return; busy = true;
    if (first || !data) { if (!$('list')) $app.innerHTML = '<div class="login" style="text-align:center">Chargement…</div>'; else $('list').innerHTML = '<div class="empty">Chargement de la semaine…</div>'; }
    call({ a:'admin', w: w }).then(function(d){ data = d; render(); var l = $('live'); l.className = 'live'; $('liveT').textContent = w === 0 ? 'En direct · actualisé toutes les 30 s' : 'Historique'; })
      .catch(function(e){
        if (e.message === 'code') { store('t', null); tok = ''; return login(true); }
        if (!data && !$('list')) { $app.innerHTML = '<div class="login" style="text-align:center">Pas de connexion au serveur.<br><br><button class="btn blue" id="re">Réessayer</button></div>'; $('re').onclick = function(){ load(true); }; }
        else { var l = $('live'); if (l) { l.className = 'live err'; $('liveT').textContent = 'Connexion perdue · nouvel essai…'; } }
      }).then(function(){ busy = false; });
  }
  load(true);
  setInterval(function(){ if (data && w === 0 && !document.hidden && !carteS) load(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && data && w === 0) load(); });
})();
</script>
</body>
</html>
